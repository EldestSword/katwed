name: Realtime load lab

on:
  push:
    branches:
      - performance/realtime-scaling-free-tier
    paths:
      - '.github/workflows/realtime-load-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KATWED_LOCAL_SUPABASE: YES

jobs:
  local-supabase-load-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Start local Supabase and apply full migration chain
        run: npm run supabase:local:start

      - name: Bridge Supabase pgTAP compatibility network
        run: |
          docker network create supabase_network_katwed >/dev/null 2>&1 || true
          docker network connect --alias db supabase_network_katwed supabase_db_katwed

      - name: Run resulting-schema, security and live-flow tests
        run: npm run test:supabase:local

      - name: Run real PostgreSQL concurrency tests
        run: npm run test:supabase:concurrency

      - name: Run priority 25/50/75/100 Player load matrix
        run: npm run loadtest:supabase:local

      - name: Upload load-lab reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtime-load-lab-reports
          path: artifacts/local-supabase/
          if-no-files-found: ignore
          retention-days: 7

      - name: Capture local Supabase status on failure
        if: failure()
        run: npm run supabase:local:status || true

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:local:stop || true
