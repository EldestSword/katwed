name: Temporary Studio validation workspace
on:
  push:
    branches: [design/premium-complete]
    paths: [.github/workflows/studio-validation-bundle.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package tracked source and Linux dependencies, never credentials
        shell: bash
        run: |
          mkdir -p /tmp/katwed-validation
          git archive HEAD | tar -x -C /tmp/katwed-validation
          rm -rf /tmp/katwed-validation/artwork
          cp -a node_modules /tmp/katwed-validation/node_modules
          tar -czf /tmp/katwed-validation.tar.gz -C /tmp/katwed-validation .
      - uses: actions/upload-artifact@v4
        with:
          name: katwed-validation-workspace
          path: /tmp/katwed-validation.tar.gz
          retention-days: 1
          compression-level: 0
