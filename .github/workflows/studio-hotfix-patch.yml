name: Studio Hotfix Patch

on:
  push:
    branches:
      - hotfix/premium-studio-settings

permissions:
  contents: write

jobs:
  patch-browser-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/premium-studio-settings
          fetch-depth: 0
      - name: Update browser tests for six-section Studio settings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/smoke.spec.ts')
          text = path.read_text()

          # Add a reusable in-dialog section switcher after the existing opener.
          anchor = "  return dialog\n}\n\nasync function openAddQuestion"
          helper = """  return dialog
}

async function selectQuizSettingsSection(dialog: Locator, section: QuizSettingsSection) {
  await dialog.getByRole('button', { name: new RegExp(`^${section}`) }).click()
  const regionName = section === 'Themes'
    ? \"Choose the room's visual identity\"
    : section === 'Backgrounds'
      ? 'Set the stage'
      : section === 'Answer colours'
        ? 'Choose the contestant palette'
        : section === 'Cover'
          ? 'Dress the library card'
          : section === 'Game'
            ? 'Choose how this quiz plays'
            : 'Manage the mash-up cast'
  await expect(dialog.getByRole('region', { name: regionName })).toBeVisible()
}

async function openAddQuestion"""
          assert anchor in text
          text = text.replace(anchor, helper, 1)

          # Head-to-Head controls now live on Game.
          h2h_start = text.index("test('Head-to-Head authoring and a true two-player untimed game work end to end'")
          h2h_end = text.index("test('a blind Head-to-Head file imports", h2h_start)
          h2h = text[h2h_start:h2h_end].replace("openQuizSettings(page)", "openQuizSettings(page, 'Game')")
          text = text[:h2h_start] + h2h + text[h2h_end:]

          # Theme/background flow: the catalog and stage picker are deliberately separate sections now.
          theme_start = text.index("test('the imported theme catalogue persists a Batch 3 theme")
          theme_end = text.index("test('quiz covers persist", theme_start)
          theme = text[theme_start:theme_end]
          theme = theme.replace("  let backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })\n", "  let backgroundPicker: Locator\n", 1)
          theme = theme.replace(
            "  if (desktopViewport) await page.setViewportSize(desktopViewport)\n  await expect(backgroundPicker.getByRole('button')).toHaveCount(4)",
            "  if (desktopViewport) await page.setViewportSize(desktopViewport)\n  await selectQuizSettingsSection(settings, 'Backgrounds')\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })\n  await expect(backgroundPicker.getByRole('button')).toHaveCount(4)",
            1,
          )
          theme = theme.replace(
            "  await expect(page.getByLabel('Katwed! theme preview')).not.toHaveAttribute('data-quiz-background')\n  const themeGrid = themePicker.locator('.quiz-theme-grid')",
            "  await expect(page.getByLabel('Katwed! theme preview')).not.toHaveAttribute('data-quiz-background')\n  await selectQuizSettingsSection(settings, 'Themes')\n  const themeGrid = themePicker.locator('.quiz-theme-grid')",
            1,
          )
          theme = theme.replace(
            "  await themePicker.getByRole('button', { name: /Chiptune/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })",
            "  await themePicker.getByRole('button', { name: /Chiptune/ }).click()\n  await selectQuizSettingsSection(settings, 'Backgrounds')\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })",
            1,
          )
          theme = theme.replace(
            "  await expect(chiptunePreview).toHaveAttribute('data-quiz-background', 'chiptune-pixels')\n  await themePicker.getByRole('button', { name: /Glass/ }).click()",
            "  await expect(chiptunePreview).toHaveAttribute('data-quiz-background', 'chiptune-pixels')\n  await selectQuizSettingsSection(settings, 'Themes')\n  await themePicker.getByRole('button', { name: /Glass/ }).click()",
            1,
          )
          theme = theme.replace(
            "  await themePicker.getByRole('button', { name: /Glass/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })",
            "  await themePicker.getByRole('button', { name: /Glass/ }).click()\n  await selectQuizSettingsSection(settings, 'Backgrounds')\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })",
            1,
          )
          theme = theme.replace(
            "  await expect(preview).toHaveCSS('background-image', /glass-frost\\.webp/)\n  await themePicker.getByRole('button', { name: /Paper/ }).click()",
            "  await expect(preview).toHaveCSS('background-image', /glass-frost\\.webp/)\n  await selectQuizSettingsSection(settings, 'Themes')\n  await themePicker.getByRole('button', { name: /Paper/ }).click()",
            1,
          )
          theme = theme.replace(
            "  await themePicker.getByRole('button', { name: /Paper/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })",
            "  await themePicker.getByRole('button', { name: /Paper/ }).click()\n  await selectQuizSettingsSection(settings, 'Backgrounds')\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })",
            1,
          )
          theme = theme.replace(
            "  await expect(page.getByLabel('Paper theme preview')).not.toHaveAttribute('data-quiz-background')\n  await themePicker.getByRole('button', { name: /Glass/ }).click()",
            "  await expect(page.getByLabel('Paper theme preview')).not.toHaveAttribute('data-quiz-background')\n  await selectQuizSettingsSection(settings, 'Themes')\n  await themePicker.getByRole('button', { name: /Glass/ }).click()",
            1,
          )
          # Second Glass selection also needs a switch back to Backgrounds.
          needle = "  await themePicker.getByRole('button', { name: /Glass/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })"
          assert needle in theme
          theme = theme.replace(needle, "  await themePicker.getByRole('button', { name: /Glass/ }).click()\n  await selectQuizSettingsSection(settings, 'Backgrounds')\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })", 1)

          # Saved/duplicated theme checks: verify background from its own section.
          theme = theme.replace(
            "  await expect(settings.getByRole('group', { name: 'Quiz theme' }).getByRole('button', { name: /Glass/ }))\n    .toHaveAttribute('aria-pressed', 'true')\n  await expect(settings.getByRole('group', { name: 'Quiz background' }).getByRole('button', { name: /Frost/ }))",
            "  await expect(settings.getByRole('group', { name: 'Quiz theme' }).getByRole('button', { name: /Glass/ }))\n    .toHaveAttribute('aria-pressed', 'true')\n  await selectQuizSettingsSection(settings, 'Backgrounds')\n  await expect(settings.getByRole('group', { name: 'Quiz background' }).getByRole('button', { name: /Frost/ }))",
          )

          # Final Paper selection uses Themes then Backgrounds.
          theme = theme.replace(
            "  await settings.getByRole('group', { name: 'Quiz theme' }).getByRole('button', { name: /Paper/ }).click()\n  const paperBackgrounds = settings.getByRole('group', { name: 'Quiz background' })",
            "  await settings.getByRole('group', { name: 'Quiz theme' }).getByRole('button', { name: /Paper/ }).click()\n  await selectQuizSettingsSection(settings, 'Backgrounds')\n  const paperBackgrounds = settings.getByRole('group', { name: 'Quiz background' })",
            1,
          )
          text = text[:theme_start] + theme + text[theme_end:]

          # Cover lifecycle controls now live on Cover.
          cover_start = text.index("test('quiz covers persist")
          cover_end = text.index("test('quiz library search", cover_start)
          cover_block = text[cover_start:cover_end].replace("openQuizSettings(page, 'Themes')", "openQuizSettings(page, 'Cover')")
          text = text[:cover_start] + cover_block + text[cover_end:]

          path.write_text(text)
          PY
          rm .github/workflows/studio-hotfix-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/smoke.spec.ts .github/workflows/studio-hotfix-patch.yml
          git commit -m "test: follow Studio settings navigation"
          git push origin HEAD:hotfix/premium-studio-settings
