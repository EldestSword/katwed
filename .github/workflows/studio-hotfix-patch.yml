name: Studio Hotfix Patch

on:
  push:
    branches:
      - hotfix/premium-studio-settings

permissions:
  contents: write

jobs:
  patch-browser-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/premium-studio-settings
          fetch-depth: 0
      - name: Update browser tests for six-section Studio settings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/smoke.spec.ts')
          text = path.read_text()
          anchor = "  return dialog\n}\n\nasync function openAddQuestion"
          helper = "  return dialog\n}\n\nasync function selectQuizSettingsSection(dialog: Locator, section: QuizSettingsSection) {\n  await dialog.getByRole('button', { name: new RegExp(`^${section}`) }).click()\n  const regionName = section === 'Themes'\n    ? \"Choose the room's visual identity\"\n    : section === 'Backgrounds'\n      ? 'Set the stage'\n      : section === 'Answer colours'\n        ? 'Choose the contestant palette'\n        : section === 'Cover'\n          ? 'Dress the library card'\n          : section === 'Game'\n            ? 'Choose how this quiz plays'\n            : 'Manage the mash-up cast'\n  await expect(dialog.getByRole('region', { name: regionName })).toBeVisible()\n}\n\nasync function openAddQuestion"
          assert anchor in text
          text = text.replace(anchor, helper, 1)

          h2h_start = text.index("test('Head-to-Head authoring and a true two-player untimed game work end to end'")
          h2h_end = text.index("test('a blind Head-to-Head file imports", h2h_start)
          h2h = text[h2h_start:h2h_end].replace("openQuizSettings(page)", "openQuizSettings(page, 'Game')")
          text = text[:h2h_start] + h2h + text[h2h_end:]

          theme_start = text.index("test('the imported theme catalogue persists a Batch 3 theme")
          theme_end = text.index("test('quiz covers persist", theme_start)
          theme = text[theme_start:theme_end]
          old = "  let backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })\n"
          assert old in theme
          theme = theme.replace(old, "  let backgroundPicker: Locator\n", 1)

          old = "  if (desktopViewport) await page.setViewportSize(desktopViewport)\n  await expect(backgroundPicker.getByRole('button')).toHaveCount(4)"
          new = "  if (desktopViewport) await page.setViewportSize(desktopViewport)\n  await selectQuizSettingsSection(settings, 'Backgrounds')\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })\n  await expect(backgroundPicker.getByRole('button')).toHaveCount(4)"
          assert old in theme
          theme = theme.replace(old, new, 1)

          old = "  await expect(page.getByLabel('Katwed! theme preview')).not.toHaveAttribute('data-quiz-background')\n  const themeGrid = themePicker.locator('.quiz-theme-grid')"
          new = "  await expect(page.getByLabel('Katwed! theme preview')).not.toHaveAttribute('data-quiz-background')\n  await selectQuizSettingsSection(settings, 'Themes')\n  const themeGrid = themePicker.locator('.quiz-theme-grid')"
          assert old in theme
          theme = theme.replace(old, new, 1)

          transitions = [
            ("  await themePicker.getByRole('button', { name: /Chiptune/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })", "  await themePicker.getByRole('button', { name: /Chiptune/ }).click()\n  await selectQuizSettingsSection(settings, 'Backgrounds')\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })"),
            ("  await expect(chiptunePreview).toHaveAttribute('data-quiz-background', 'chiptune-pixels')\n  await themePicker.getByRole('button', { name: /Glass/ }).click()", "  await expect(chiptunePreview).toHaveAttribute('data-quiz-background', 'chiptune-pixels')\n  await selectQuizSettingsSection(settings, 'Themes')\n  await themePicker.getByRole('button', { name: /Glass/ }).click()"),
            ("  await expect(preview).toHaveCSS('background-image', /glass-frost\\.webp/)\n  await themePicker.getByRole('button', { name: /Paper/ }).click()", "  await expect(preview).toHaveCSS('background-image', /glass-frost\\.webp/)\n  await selectQuizSettingsSection(settings, 'Themes')\n  await themePicker.getByRole('button', { name: /Paper/ }).click()"),
            ("  await themePicker.getByRole('button', { name: /Paper/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })", "  await themePicker.getByRole('button', { name: /Paper/ }).click()\n  await selectQuizSettingsSection(settings, 'Backgrounds')\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })"),
            ("  await expect(page.getByLabel('Paper theme preview')).not.toHaveAttribute('data-quiz-background')\n  await themePicker.getByRole('button', { name: /Glass/ }).click()", "  await expect(page.getByLabel('Paper theme preview')).not.toHaveAttribute('data-quiz-background')\n  await selectQuizSettingsSection(settings, 'Themes')\n  await themePicker.getByRole('button', { name: /Glass/ }).click()"),
          ]
          for old, new in transitions:
            assert old in theme, old
            theme = theme.replace(old, new, 1)

          glass_to_bg = "  await themePicker.getByRole('button', { name: /Glass/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })"
          glass_to_bg_new = "  await themePicker.getByRole('button', { name: /Glass/ }).click()\n  await selectQuizSettingsSection(settings, 'Backgrounds')\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })"
          assert theme.count(glass_to_bg) == 2, theme.count(glass_to_bg)
          theme = theme.replace(glass_to_bg, glass_to_bg_new)

          saved = "  await expect(settings.getByRole('group', { name: 'Quiz theme' }).getByRole('button', { name: /Glass/ }))\n    .toHaveAttribute('aria-pressed', 'true')\n  await expect(settings.getByRole('group', { name: 'Quiz background' }).getByRole('button', { name: /Frost/ }))"
          saved_new = "  await expect(settings.getByRole('group', { name: 'Quiz theme' }).getByRole('button', { name: /Glass/ }))\n    .toHaveAttribute('aria-pressed', 'true')\n  await selectQuizSettingsSection(settings, 'Backgrounds')\n  await expect(settings.getByRole('group', { name: 'Quiz background' }).getByRole('button', { name: /Frost/ }))"
          assert theme.count(saved) == 2, theme.count(saved)
          theme = theme.replace(saved, saved_new)

          old = "  await settings.getByRole('group', { name: 'Quiz theme' }).getByRole('button', { name: /Paper/ }).click()\n  const paperBackgrounds = settings.getByRole('group', { name: 'Quiz background' })"
          new = "  await settings.getByRole('group', { name: 'Quiz theme' }).getByRole('button', { name: /Paper/ }).click()\n  await selectQuizSettingsSection(settings, 'Backgrounds')\n  const paperBackgrounds = settings.getByRole('group', { name: 'Quiz background' })"
          assert old in theme
          theme = theme.replace(old, new, 1)
          text = text[:theme_start] + theme + text[theme_end:]

          cover_start = text.index("test('quiz covers persist")
          cover_end = text.index("test('quiz library search", cover_start)
          cover_block = text[cover_start:cover_end]
          assert cover_block.count("openQuizSettings(page, 'Themes')") == 7, cover_block.count("openQuizSettings(page, 'Themes')")
          cover_block = cover_block.replace("openQuizSettings(page, 'Themes')", "openQuizSettings(page, 'Cover')")
          text = text[:cover_start] + cover_block + text[cover_end:]

          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/smoke.spec.ts
          git commit -m "test: follow Studio settings navigation"
          git push origin HEAD:hotfix/premium-studio-settings
