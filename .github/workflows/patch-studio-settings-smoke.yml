name: Patch Studio settings smoke tests

on:
  push:
    branches:
      - hotfix/premium-studio-settings
    paths:
      - .github/workflows/patch-studio-settings-smoke.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/premium-studio-settings
      - name: Align smoke tests with six-section Studio settings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/smoke.spec.ts')
          text = path.read_text(encoding='utf-8')

          def test_block(title: str):
              marker = f"test('{title}"
              start = text.index(marker)
              end = text.find('\ntest(', start + 1)
              if end == -1:
                  end = len(text)
              return start, end, text[start:end]

          def replace_in_test(title: str, old: str, new: str, count: int | None = None):
              global text
              start, end, block = test_block(title)
              actual = block.count(old)
              if count is not None and actual != count:
                  raise RuntimeError(f'{title}: expected {count} occurrences of {old!r}, found {actual}')
              if actual == 0:
                  raise RuntimeError(f'{title}: missing expected text {old!r}')
              block = block.replace(old, new)
              text = text[:start] + block + text[end:]

          # Head-to-Head controls now live in the dedicated Game section.
          replace_in_test(
              'Head-to-Head authoring and a true two-player untimed game work end to end',
              'openQuizSettings(page)',
              "openQuizSettings(page, 'Game')",
              4,
          )

          # Cover controls now live in their own section.
          replace_in_test(
              'quiz covers persist across the library lifecycle and remain independent after duplication',
              "openQuizSettings(page, 'Themes')",
              "openQuizSettings(page, 'Cover')",
              3,
          )
          replace_in_test(
              'Storage Manager reviews and cleans a replaced Demo cover without removing the current cover',
              "openQuizSettings(page, 'Themes')",
              "openQuizSettings(page, 'Cover')",
              3,
          )

          # Theme catalogue flow deliberately crosses between Themes and Backgrounds.
          title = 'the imported theme catalogue persists a Batch 3 theme through duplication and audience game phases'
          start, end, block = test_block(title)

          replacements = [
              (
                  "  if (desktopViewport) await page.setViewportSize(desktopViewport)\n  await expect(backgroundPicker.getByRole('button')).toHaveCount(4)",
                  "  if (desktopViewport) await page.setViewportSize(desktopViewport)\n  await settings.getByRole('button', { name: /^Backgrounds/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })\n  await expect(backgroundPicker.getByRole('button')).toHaveCount(4)",
              ),
              (
                  "  await expect(page.getByLabel('Katwed! theme preview')).not.toHaveAttribute('data-quiz-background')\n  const themeGrid = themePicker.locator('.quiz-theme-grid')",
                  "  await expect(page.getByLabel('Katwed! theme preview')).not.toHaveAttribute('data-quiz-background')\n  await settings.getByRole('button', { name: /^Themes/ }).click()\n  const themeGrid = themePicker.locator('.quiz-theme-grid')",
              ),
              (
                  "  await themePicker.getByRole('button', { name: /Chiptune/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })",
                  "  await themePicker.getByRole('button', { name: /Chiptune/ }).click()\n  await settings.getByRole('button', { name: /^Backgrounds/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })",
              ),
              (
                  "  await expect(chiptunePreview).toHaveAttribute('data-quiz-background', 'chiptune-pixels')\n  await themePicker.getByRole('button', { name: /Glass/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })",
                  "  await expect(chiptunePreview).toHaveAttribute('data-quiz-background', 'chiptune-pixels')\n  await settings.getByRole('button', { name: /^Themes/ }).click()\n  await themePicker.getByRole('button', { name: /Glass/ }).click()\n  await settings.getByRole('button', { name: /^Backgrounds/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })",
              ),
              (
                  "  await expect(preview).toHaveCSS('background-image', /glass-frost\\.webp/)\n  await themePicker.getByRole('button', { name: /Paper/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })",
                  "  await expect(preview).toHaveCSS('background-image', /glass-frost\\.webp/)\n  await settings.getByRole('button', { name: /^Themes/ }).click()\n  await themePicker.getByRole('button', { name: /Paper/ }).click()\n  await settings.getByRole('button', { name: /^Backgrounds/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })",
              ),
              (
                  "  await expect(page.getByLabel('Paper theme preview')).not.toHaveAttribute('data-quiz-background')\n  await themePicker.getByRole('button', { name: /Glass/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })",
                  "  await expect(page.getByLabel('Paper theme preview')).not.toHaveAttribute('data-quiz-background')\n  await settings.getByRole('button', { name: /^Themes/ }).click()\n  await themePicker.getByRole('button', { name: /Glass/ }).click()\n  await settings.getByRole('button', { name: /^Backgrounds/ }).click()\n  backgroundPicker = settings.getByRole('group', { name: 'Quiz background' })",
              ),
              (
                  "  settings = await openQuizSettings(page, 'Themes')\n  await expect(settings.getByRole('group', { name: 'Quiz theme' }).getByRole('button', { name: /Glass/ }))\n    .toHaveAttribute('aria-pressed', 'true')\n  await expect(settings.getByRole('group', { name: 'Quiz background' }).getByRole('button', { name: /Frost/ }))",
                  "  settings = await openQuizSettings(page, 'Themes')\n  await expect(settings.getByRole('group', { name: 'Quiz theme' }).getByRole('button', { name: /Glass/ }))\n    .toHaveAttribute('aria-pressed', 'true')\n  await settings.getByRole('button', { name: /^Backgrounds/ }).click()\n  await expect(settings.getByRole('group', { name: 'Quiz background' }).getByRole('button', { name: /Frost/ }))",
              ),
              (
                  "  settings = await openQuizSettings(page, 'Themes')\n  await expect(settings.getByRole('group', { name: 'Quiz theme' }).getByRole('button', { name: /Paper/ })).toHaveAttribute('aria-pressed', 'true')",
                  "  settings = await openQuizSettings(page, 'Themes')\n  await expect(settings.getByRole('group', { name: 'Quiz theme' }).getByRole('button', { name: /Paper/ })).toHaveAttribute('aria-pressed', 'true')",
              ),
              (
                  "  settings = await openQuizSettings(page, 'Themes')\n  await settings.getByRole('group', { name: 'Quiz theme' }).getByRole('button', { name: /Paper/ }).click()\n  const paperBackgrounds = settings.getByRole('group', { name: 'Quiz background' })",
                  "  settings = await openQuizSettings(page, 'Themes')\n  await settings.getByRole('group', { name: 'Quiz theme' }).getByRole('button', { name: /Paper/ }).click()\n  await settings.getByRole('button', { name: /^Backgrounds/ }).click()\n  const paperBackgrounds = settings.getByRole('group', { name: 'Quiz background' })",
              ),
          ]

          # The reload and duplication Glass/Frost snippet occurs twice; handle both.
          reload_old, reload_new = replacements[6]
          if block.count(reload_old) != 2:
              raise RuntimeError(f'theme flow: expected 2 Glass/Frost reload snippets, found {block.count(reload_old)}')
          block = block.replace(reload_old, reload_new)

          # Remaining replacements should each occur once. Skip the no-op guard entry.
          for index, (old, new) in enumerate(replacements):
              if index in (6, 7):
                  continue
              actual = block.count(old)
              if actual != 1:
                  raise RuntimeError(f'theme flow replacement {index}: expected 1 occurrence, found {actual}')
              block = block.replace(old, new, 1)

          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patched smoke tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/smoke.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: align Studio settings smoke navigation"
          git push origin HEAD:hotfix/premium-studio-settings
